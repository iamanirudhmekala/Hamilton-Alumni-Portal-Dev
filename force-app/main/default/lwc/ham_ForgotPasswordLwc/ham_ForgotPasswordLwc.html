<template>
    <div class="card-wrapper">
        <div class="main-container slds-p-around_large">
            <template if:true={showForm}>
                <!-- Title & Description -->
                <div class="brand-header slds-m-bottom_small">{label.forgotPasswordTitle}</div>
                <p class="system-description-text slds-m-bottom_large">
                    {label.forgotPasswordDesc}
                </p>
                
                <!-- Email Input -->
                <div class="slds-form-element slds-m-bottom_medium">
                    <lightning-input 
                        type="email" 
                        label={label.emailInputLabel} 
                        value={emailAddress} 
                        onchange={handleEmailChange}
                        placeholder={label.emailPlaceholder}
                        class="custom-form-input"
                        required>
                    </lightning-input>
                </div>

                <!-- CAPTCHA Section -->
                <div class="captcha-master-box slds-m-bottom_medium">
                    <label class="slds-form-element__label secure-label-style">{label.captchaLabel}</label>
                    
                    <div class="captcha-interactive-row">
                        <div class="captcha-code-display-frame unselectable">
                            <span class="captcha-noise-text">{generatedCaptchaCode}</span>
                        </div>
                        
                        <lightning-button-icon 
                            icon-name="utility:refresh" 
                            alternative-text={label.captchaInputLabel} 
                            title={label.captchaInputLabel}
                            onclick={refreshCaptchaCode}
                            class="custom-refresh-icon">
                        </lightning-button-icon>
                    </div>

                    <div class="slds-m-top_small">
                        <lightning-input 
                            type="text" 
                            label={label.captchaInputLabel} 
                            value={userCaptchaInput} 
                            onchange={handleCaptchaInputChange}
                            placeholder={label.captchaPlaceholder}
                            maxlength="6"
                            class="custom-form-input"
                            required>
                        </lightning-input>
                    </div>
                </div>

                <!-- Error Messages -->
                <template if:true={errorMessage}>
                    <div class="error-banner slds-m-bottom_medium" role="alert">
                        <p>{errorMessage}</p>
                    </div>
                </template>

                <!-- Actions -->
                <div class="action-buttons-grid">
                    <lightning-button 
                        label={label.forgotPasswordBtnLabel} 
                        variant="brand" 
                        onclick={handleResetPassword}
                        disabled={isResetDisabled}
                        class="primary-brand-btn">
                    </lightning-button>
                    
                    <lightning-button 
                        label={label.forgotPasswordBackToLogin} 
                        variant="neutral" 
                        onclick={handleBackToLogin}
                        class="secondary-neutral-btn">
                    </lightning-button>
                </div>
            </template>

            <template if:false={showForm}>
                <!-- Success State -->
                <div class="brand-header slds-m-bottom_small">{label.forgotPasswordTitle}</div>
                
                <template if:false={isUnverified}>
                    <div class="info-banner slds-m-bottom_large" role="alert">
                        <p>{label.forgotPasswordSuccessMsg}</p>
                    </div>
                </template>

                <template if:true={isUnverified}>
                    <div class="warning-banner slds-m-bottom_large" role="alert">
                        <p>{unverifiedMessage}</p>
                    </div>
                </template>

                <div class="action-row">
                    <lightning-button 
                        label={label.forgotPasswordBackToLogin} 
                        variant="neutral" 
                        onclick={handleBackToLogin}
                        class="slds-size_full secondary-neutral-btn">
                    </lightning-button>
                </div>
            </template>
        </div>
    </div>
</template>
