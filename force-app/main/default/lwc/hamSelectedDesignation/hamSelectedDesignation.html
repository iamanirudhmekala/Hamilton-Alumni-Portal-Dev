<template>
    <div class="banner selected-designation">
        <div class="designation-name" style="flex: 1;text-align: left; align-self:center;">{name}</div>
        <div style="position: relative;">
            <span class="dollar">$</span>
            <input type="number" class="designation-amt" value={amt} oninput={handleAmtChange} disabled={isDisabled} min="1" step="1">
        </div>
        <button onclick={handleRemoveDesignation} disabled={isDisabled}>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-x" aria-hidden="true">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
            </svg>
        </button>
        <template if:true={isDisabled}>
            <lightning-helptext class="slds-var-p-left_small"
                content="Pledge designation can only be changed on the pledge tab in the amount step."></lightning-helptext>
        </template>
    </div>
</template>
