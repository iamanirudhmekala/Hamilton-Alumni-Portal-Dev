<template>
    <div class="card-wrapper">
        <div class={accordionContainerClass}>
            <!-- Accordion Header -->
            <div class={accordionHeaderClass} onclick={toggleAccordion}>
                <span class="accordion-arrow">{accordionArrow}</span>
                <span class="accordion-title">Alternative Login via Code</span>
            </div>

            <!-- Accordion Content -->
            <template if:true={isAccordionOpen}>
                <div class="accordion-content">
                    <template if:true={showEmailPage}>
                        <div class="slds-p-around_large">
                            <div class="brand-header slds-m-bottom_small">{label.altLoginTitle}</div>
                            <p class="system-description-text slds-m-bottom_large">
                                {label.altLoginDesc}
                            </p>
                            
                            <div class="slds-form-element slds-m-bottom_medium">
                                <lightning-input 
                                    type="email" 
                                    label={label.emailInputLabel} 
                                    value={emailAddress} 
                                    onchange={handleEmailChange}
                                    placeholder={label.emailPlaceholder}
                                    class="custom-form-input"
                                    required>
                                </lightning-input>
                            </div>

                            <div class="captcha-master-box slds-m-bottom_medium">
                                <label class="slds-form-element__label secure-label-style">{label.captchaLabel}</label>
                                
                                <div class="captcha-interactive-row">
                                    <div class="captcha-code-display-frame unselectable">
                                        <span class="captcha-noise-text">{generatedCaptchaCode}</span>
                                    </div>
                                    
                                    <lightning-button-icon 
                                        icon-name="utility:refresh" 
                                        alternative-text={label.captchaInputLabel} 
                                        title={label.captchaInputLabel}
                                        onclick={refreshCaptchaCode}
                                        class="custom-refresh-icon">
                                    </lightning-button-icon>
                                </div>

                                <div class="slds-m-top_small">
                                    <lightning-input 
                                        type="text" 
                                        label={label.captchaInputLabel} 
                                        value={userCaptchaInput} 
                                        onchange={handleCaptchaInputChange}
                                        placeholder={label.captchaPlaceholder}
                                        maxlength="6"
                                        class="custom-form-input"
                                        required>
                                    </lightning-input>
                                </div>
                            </div>

                            <template if:true={errorMessage}>
                                <div class="error-banner slds-m-bottom_medium" role="alert">
                                    <p>{errorMessage}</p>
                                </div>
                            </template>

                            <template if:true={infoMessage}>
                                <div class="info-banner slds-m-bottom_medium" role="alert">
                                    <p>{infoMessage}</p>
                                </div>
                            </template>
                    
                            <div class="action-row">
                                <lightning-button 
                                    label={label.requestBtnLabel} 
                                    variant="brand" 
                                    onclick={handleSendOtp}
                                    disabled={isRequestDisabled}
                                    class="slds-size_full primary-brand-btn">
                                </lightning-button>
                            </div>
                        </div>
                    </template>

                    <template if:true={showOtpPage}>
                        <div class="slds-p-around_large">
                            <div class="brand-header slds-m-bottom_small">{label.otpTitle}</div>
                            <p class="system-description-text slds-m-bottom_large">
                                {label.otpDesc}
                            </p>

                            <div class="slds-form-element slds-m-bottom_medium">
                                <lightning-input 
                                    label={label.otpInputLabel} 
                                    type="text"
                                    maxlength="6" 
                                    value={otpCode} 
                                    onchange={handleOtpChange}
                                    placeholder={label.otpPlaceholder}
                                    class="custom-form-input"
                                    required>
                                </lightning-input>
                            </div>

                            <template if:true={errorMessage}>
                                <div class="error-banner slds-m-bottom_medium" role="alert">
                                    <p>{errorMessage}</p>
                                </div>
                            </template>
                    
                            <div class="resend-wrapper slds-m-bottom_large">
                                <template if:true={isResendDisabled}>
                                    <span class="cooldown-timer-text">
                                        {computedResendLockText}
                                    </span>
                                </template>
                                <template if:false={isResendDisabled}>
                                    <lightning-button 
                                        variant="base" 
                                        label={label.resendBtnLabel} 
                                        onclick={handleSendOtp}
                                        disabled={isProcessing}
                                        class="resend-active-link">
                                    </lightning-button>
                                </template>
                            </div>

                            <div class="action-buttons-grid">
                                <lightning-button 
                                    label={label.verifyBtnLabel} 
                                    variant="brand" 
                                    onclick={handleVerifyOtp} 
                                    disabled={isVerifyDisabled}
                                    class="primary-brand-btn">
                                </lightning-button>
                                <lightning-button 
                                    label={label.backBtnLabel} 
                                    variant="neutral" 
                                    onclick={handleNavigationBack}
                                    class="secondary-neutral-btn">
                                </lightning-button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
