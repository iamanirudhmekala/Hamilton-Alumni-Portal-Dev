<template>
    <div class="single-page-form">
        <div class="form-layout-with-carousel">
            <!-- Main Content -->
            <div class="form-content-main">
                <div class="thank-you-hero">
                    <img src={thankYouLogoUrl} alt="Hamilton College Students" class="thank-you-hero-image-simple">
                </div>

                <!-- Gift Summary Card -->
                <div class="form-section-compact" style="margin-top: 2rem;">
                    <div class="thank-you-amount-card">
                        <div class="thank-you-amount-header">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart" aria-hidden="true" style="color: rgb(0, 32, 91);">
                                <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path>
                            </svg>
                            <span>Your Gift</span>
                        </div>
                        <div class="thank-you-amount-value">${formattedAmount}</div>
                        <div class="thank-you-amount-type">{paymentTypeLabel}</div>
                        <p class="thank-you-gift-message">Thank You! Your generosity makes a difference at Hamilton College</p>
                    </div>

                    <!-- Designations -->
                    <template lwc:if={hasDesignations}>
                        <div class="thank-you-designations">
                            <h3 class="thank-you-section-title">Supporting</h3>
                            <div class="thank-you-designation-list">
                                <template for:each={designationsList} for:item="selectedDesignation">
                                    <div key={selectedDesignation.name} class="thank-you-designation-item">
                                        <span class="thank-you-designation-name">{selectedDesignation.name}</span>
                                        <span class="thank-you-designation-amount">${selectedDesignation.amtFormatted}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Gift Details -->
                    <div class="thank-you-details">
                        <h3 class="thank-you-section-title">Confirmation Details</h3>
                        <div class="thank-you-details-grid">
                            <template if:true={showDonorName}>
                                <div class="thank-you-detail-item">
                                    <span class="thank-you-detail-label">Donor</span>
                                    <span class="thank-you-detail-value">{data.name}</span>
                                </div>
                            </template>
                            <div class="thank-you-detail-item">
                                <span class="thank-you-detail-label">Email</span>
                                <span class="thank-you-detail-value">{personEmail}</span>
                            </div>
                            <div class="thank-you-detail-item">
                                <span class="thank-you-detail-label">Payment Method</span>
                                <span class="thank-you-detail-value">{paymentMethodLabel}</span>
                            </div>
                            <template if:true={hasInMemoryInHonor}>
                                <div class="thank-you-detail-item full-width">
                                    <span class="thank-you-detail-label">In Memory/Honor Of</span>
                                    <span class="thank-you-detail-value">{inMemoryInHonorName}</span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Email Confirmation Notice -->
                    <div class="thank-you-email-notice">
                        <div class="thank-you-email-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-check-big" aria-hidden="true">
                                <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
                                <path d="m9 11 3 3L22 4"></path>
                            </svg>
                        </div>
                        <p>
                            A confirmation email has been sent to <strong>{personEmail}</strong>
                        </p>
                    </div>

                    <div class="thank-you-actions">
                        <button type="button" class="btn btn-primary btn-large" onclick={handleReset}>Make Another Gift</button>
                        <button type="button" class="btn btn-outline btn-large download-receipt-blocked">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download" aria-hidden="true">
                                <path d="M12 15V3"></path>
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <path d="m7 10 5 5 5-5"></path>
                            </svg>
                            Download Receipt
                        </button>
                    </div>

                    <!-- Impact Message -->
                    <div class="thank-you-impact">
                        <p>
                            Your support helps provide scholarships, enhance academic programs, 
                            and maintain the beautiful campus that makes Hamilton special. 
                            Together, we're building a brighter future for our students and community.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
