<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-standard-task" style="background-color: #06a59a;">
                        <svg class="slds-icon slds-icon_small" aria-hidden="true">
                            <use xlink:href="/assets/icons/standard-sprite/svg/symbols.svg#task"></use>
                        </svg>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Career Center Volunteer Engagement</span>
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <!-- Desktop: full label buttons -->
                    <template if:false={isMobile}>
                        <div class="desktop-actions">
                            <lightning-button
                                label={filtersButtonLabel}
                                onclick={toggleFilters}>
                            </lightning-button>
                            <lightning-button
                                variant="brand"
                                label={formButtonLabel}
                                onclick={handleToggleForm}>
                            </lightning-button>
                        </div>
                    </template>
                    <!-- Mobile: icon-only buttons -->
                    <template if:true={isMobile}>
                        <div class="mobile-actions">
                            <lightning-button-icon
                                icon-name={mobileFilterIcon}
                                variant="border-filled"
                                alternative-text={mobileFilterLabel}
                                title={mobileFilterLabel}
                                onclick={toggleFilters}
                                class="slds-var-m-right_x-small">
                            </lightning-button-icon>
                            <lightning-button-icon
                                icon-name={mobileAddIcon}
                                variant="brand"
                                alternative-text={mobileAddLabel}
                                title={mobileAddLabel}
                                onclick={handleToggleForm}
                                class="slds-var-m-right_x-small">
                            </lightning-button-icon>
                        </div>
                    </template>
                    <!-- Expand/Collapse button -->
                    <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-m-left_x-small" onclick={handleToggleExpand} aria-expanded={isExpanded}>
                        <lightning-icon icon-name={expandIcon} size="x-small"></lightning-icon>
                        <span class="slds-assistive-text">Toggle Volunteer Engagement</span>
                    </button>
                </div>
            </header>
        </div>
        <template if:true={isFiltering}>
            <lightning-spinner size="small" alternative-text="Filtering"></lightning-spinner>
        </template>
        <template if:true={isExpanded}>
            <div class="slds-card__body slds-card__body_inner">
                <!-- Add Activity Form -->
                <template if:true={showAddForm}>
                    <div class="slds-box slds-box_small slds-m-bottom_medium" style="background-color: #f3f3f3;">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">
                            Add New Volunteer Activity
                        </h3>

                        <div class="slds-form slds-form_compound">

                            <!-- Quick-select chips -->
                            <template if:true={quickTopChips.length}>
                                <div class="slds-m-bottom_small slds-p-bottom_x-small quick-select-section">
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_xx-small">Common activities — tap to select:</p>

                                    <!-- Top 5 chips (always visible) -->
                                    <div class="quick-chips-row">
                                        <template for:each={quickTopChips} for:item="chip">
                                            <button
                                                key={chip.id}
                                                class={chip.chipClass}
                                                data-id={chip.id}
                                                onclick={handleQuickSelect}
                                                type="button">
                                                {chip.label}
                                            </button>
                                        </template>
                                    </div>

                                    <!-- Show more / less toggle -->
                                    <template if:true={hasMoreChips}>
                                        <button
                                            class="slds-button slds-button_neutral slds-button_small slds-m-top_x-small"
                                            type="button"
                                            onclick={handleToggleMobileChips}>
                                            {showMoreLabel}
                                        </button>

                                        <template if:true={showMoreChips}>
                                            <div class="quick-chips-row slds-m-top_x-small">
                                                <template for:each={quickMoreChips} for:item="chip">
                                                    <button
                                                        key={chip.id}
                                                        class={chip.chipClass}
                                                        data-id={chip.id}
                                                        onclick={handleQuickSelect}
                                                        type="button">
                                                        {chip.label}
                                                    </button>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </template>

                            <div class="slds-grid slds-wrap slds-gutters">

                                <!-- Involvement Code (Record Picker) -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Involvement Code
                                        </label>
                                        <div class="slds-form-element__control">
                                            <template if:true={showInvolvementPicker}>
                                                <lightning-record-picker
                                                    object-api-name="ucinn_ascendv2__Involvement_Value__c"
                                                    label="Search all involvement codes..."
                                                    placeholder="Search Involvement Code..."
                                                    value={formData.involvementId}
                                                    filter={formFilters}
                                                    matching-info={involvementMatchingInfo}
                                                    onchange={handleInvolvementChange}>
                                                </lightning-record-picker>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <!-- Owner Id -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Assigned To
                                        </label>
                                        <div class="slds-form-element__control">
                                            <lightning-record-picker
                                                object-api-name="User"
                                                label="Assigned To"
                                                placeholder="Search User to assign..."
                                                value={formData.assignedUserId}
                                                filter={userFilters}
                                                matching-info={userMatchingInfo}
                                                onchange={handleAssignmentChange}
                                                >
                                            </lightning-record-picker>
                                        </div>
                                    </div>
                                </div>

                                <!-- Start Date -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Start Date
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input
                                                type="date"
                                                class="slds-input"
                                                value={formData.startDate}
                                                data-field="startDate"
                                                onchange={handleInputChange}/>
                                        </div>
                                    </div>
                                </div>

                                <!-- End Date -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            End Date
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input
                                                type="date"
                                                class="slds-input"
                                                value={formData.endDate}
                                                data-field="endDate"
                                                onchange={handleInputChange}/>
                                        </div>
                                    </div>
                                </div>

                                <!-- Involvement Description -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Involvement Description
                                        </label>
                                        <div class="slds-form-element__control desc-typeahead">
                                            <input
                                                type="text"
                                                class="slds-input"
                                                placeholder="Search description..."
                                                value={descSearchTerm}
                                                onfocus={handleDescFocus}
                                                oninput={handleDescInput}
                                                onblur={handleDescBlur}
                                                autocomplete="off"/>
                                            <template if:true={showDescDropdown}>
                                                <div class="desc-dropdown"
                                                    onmousedown={handleDescDropdownMouseDown}
                                                    onmouseup={handleDescDropdownMouseUp}>
                                                    <template for:each={filteredDescOptions} for:item="opt">
                                                        <div
                                                            key={opt}
                                                            class="desc-option"
                                                            data-value={opt}
                                                            onmousedown={handleDescSelect}>
                                                            {opt}
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Handshake Link -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Handshake Link
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input
                                                type="text"
                                                class="slds-input"
                                                placeholder="Optional link..."
                                                value={formData.handshakeLink}
                                                data-field="handshakeLink"
                                                onchange={handleInputChange}/>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <div class="slds-m-top_small slds-grid slds-grid_align-start slds-grid_vertical-align-center">
                            <lightning-button
                                variant="brand"
                                label="Save Activity"
                                onclick={handleAddActivity}
                                disabled={isSaving}>
                            </lightning-button>
                            <template if:true={isSaving}>
                                <lightning-spinner 
                                    alternative-text="Saving..." 
                                    size="small"
                                    class="slds-m-left_small">
                                </lightning-spinner>
                            </template>
                        </div>
                    </div>

                </template>

                <!-- Edit Activity Form -->
                <template if:true={showEditForm}>
                    <div class="slds-box slds-box_small slds-m-bottom_medium" style="background-color: #fff3cd; border: 1px solid #ffc107;">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <h3 class="slds-text-heading_small">
                                Edit Volunteer Activity
                            </h3>
                            <lightning-button-icon
                                icon-name="utility:close"
                                alternative-text="Close"
                                title="Close"
                                onclick={handleCancelEdit}
                                class="slds-button_icon-small">
                            </lightning-button-icon>
                        </div>

                        <div class="slds-form slds-form_compound">
                            <div class="slds-grid slds-wrap slds-gutters">

                                <!-- Involvement Code (Record Picker) -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Involvement Code
                                        </label>
                                        <div class="slds-form-element__control">
                                            <lightning-record-picker
                                                object-api-name="ucinn_ascendv2__Involvement_Value__c"
                                                label="Involvment Values"
                                                placeholder="Search Involvement Code..."
                                                value={formData.involvementId}
                                                filter={formFilters}
                                                matching-info={involvementMatchingInfo}
                                                onchange={handleEditInvolvementChange}
                                                >
                                            </lightning-record-picker>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Assigned To -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Assigned To
                                        </label>
                                        <div class="slds-form-element__control">
                                            <lightning-record-picker
                                                object-api-name="User"
                                                label="Assigned To"
                                                placeholder="Search User to assign..."
                                                value={formData.assignedUserId}
                                                filter={userFilters}
                                                matching-info={userMatchingInfo}
                                                onchange={handleEditAssignmentChange}
                                                >
                                            </lightning-record-picker>
                                        </div>
                                    </div>
                                </div>

                                <!-- Start Date -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Start Date
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input
                                                type="date"
                                                class="slds-input"
                                                value={formData.startDate}
                                                data-field="startDate"
                                                onchange={handleEditInputChange}/>
                                        </div>
                                    </div>
                                </div>

                                <!-- End Date -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            End Date
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input
                                                type="date"
                                                class="slds-input"
                                                value={formData.endDate}
                                                data-field="endDate"
                                                onchange={handleEditInputChange}/>
                                        </div>
                                    </div>
                                </div>

                                <!-- Involvement Description -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Involvement Description
                                        </label>
                                        <div class="slds-form-element__control desc-typeahead">
                                            <input
                                                type="text"
                                                class="slds-input"
                                                placeholder="Search description..."
                                                value={descSearchTerm}
                                                onfocus={handleDescFocus}
                                                oninput={handleDescInput}
                                                onblur={handleDescBlur}
                                                autocomplete="off"/>
                                            <template if:true={showDescDropdown}>
                                                <div class="desc-dropdown"
                                                    onmousedown={handleDescDropdownMouseDown}
                                                    onmouseup={handleDescDropdownMouseUp}>
                                                    <template for:each={filteredDescOptions} for:item="opt">
                                                        <div
                                                            key={opt}
                                                            class="desc-option"
                                                            data-value={opt}
                                                            onmousedown={handleDescSelect}>
                                                            {opt}
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Handshake Link -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">
                                            Handshake Link
                                        </label>
                                        <div class="slds-form-element__control">
                                            <input
                                                type="text"
                                                class="slds-input"
                                                placeholder="Optional link..."
                                                value={formData.handshakeLink}
                                                data-field="handshakeLink"
                                                onchange={handleEditInputChange}/>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <div class="slds-m-top_small slds-grid slds-grid_align-start slds-grid_vertical-align-center">
                            <lightning-button
                                variant="success"
                                label="Update"
                                onclick={handleUpdateActivity}
                                disabled={isSaving}
                                class="slds-m-right_small">
                            </lightning-button>
                            <lightning-button 
                                variant="neutral" 
                                label="Cancel"
                                onclick={handleCancelEdit}
                                disabled={isSaving}>
                            </lightning-button>
                            <template if:true={isSaving}>
                                <lightning-spinner 
                                    alternative-text="Updating..." 
                                    size="small"
                                    class="slds-m-left_small">
                                </lightning-spinner>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Filters -->
                <!-- Filter Section (hidden by default) -->
                <template if:true={showFilters}>
                    <div class="slds-box slds-box_x-small slds-m-bottom_small slds-theme_default">
                        <div class="slds-grid slds-gutters slds-wrap">
                            <!-- Start Date Filter -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-input
                                    type="date"
                                    label="Start Date"
                                    value={filterStartDate}
                                    onchange={handleStartDateFilterChange}>
                                </lightning-input>
                            </div>
                            <!-- End Date Filter -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-input
                                    type="date"
                                    label="End Date"
                                    value={filterEndDate}
                                    onchange={handleEndDateFilterChange}>
                                </lightning-input>
                            </div>
                            <!-- Involvement Code Filter -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-combobox
                                    name="involvementCode"
                                    label="Involvement Code"
                                    placeholder="Select Involvement Code"
                                    value={filterInvolvementCode}
                                    options={involvementCodeOptions}
                                    onchange={handleInvolvementCodeChange}>
                                </lightning-combobox>
                            </div>
                            <!-- Status Filter -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-combobox
                                    name="status"
                                    label="Status"
                                    placeholder="Select Status"
                                    value={filterStatus}
                                    options={statusOptions}
                                    onchange={handleStatusFilterChange}>
                                </lightning-combobox>
                            </div>
                            <!-- Score Filter -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-input
                                    type="number"
                                    label="Minimum Score"
                                    value={filterMinScore}
                                    onchange={handleMinScoreChange}
                                    min="0"
                                    step="1">
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                            <!-- Apply Filter Button -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-order_2 slds-medium-order_1">
                                <lightning-button variant="brand" label="Apply Filters" onclick={applyFilters}></lightning-button>
                            </div>
                            <!-- Reset Filter Button -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-order_1 slds-medium-order_2">
                                <lightning-button variant="neutral" label="Reset" onclick={resetFilters}></lightning-button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Activities Table -->
                <template lwc:if={involvementData}>
                    <div class="slds-table_header-fixed_container" style="max-height: 400px;">
                        <div class="slds-scrollable_y">
                        <lightning-card title="Involvement Records">
                                <lightning-datatable
                                    key-field="Id"
                                    data={paginatedActivities}
                                    columns={involvementColumnData} 
                                    hide-checkbox-column
                                    onrowaction={handleRowAction}>
                                </lightning-datatable>
                            </lightning-card>
                        </div>
                    </div>
                </template>

                <!-- Summary Stats -->
                <div class="slds-grid slds-wrap slds-gutters_small slds-m-top_medium">
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-2">
                        <div class="slds-box slds-box_x-small slds-text-align_center" style="background-color: #f3f3f3;">
                            <div class="slds-text-color_weak slds-text-body_small">Current Year Score ({currentFiscalYear})</div>
                            
                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                                
                                <template if:true={showUpArrowCurrent}>
                                    <div class="slds-text-heading_medium slds-m-right_xx-small slds-text-color_success">{currentFiscalYearScore}</div>
                                    <lightning-icon icon-name="utility:arrowup" size="x-small" class="slds-text-color_success"></lightning-icon>
                                </template>
                                <template if:true={showDownArrowCurrent}>
                                    <div class="slds-text-heading_medium slds-m-right_xx-small slds-text-color_error">{currentFiscalYearScore}</div>
                                    <lightning-icon icon-name="utility:arrowdown" size="x-small" style="color: #ea001e;"></lightning-icon>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-2">
                        <div class="slds-box slds-box_x-small slds-text-align_center" style="background-color: #f3f3f3;">
                            <div class="slds-text-color_weak slds-text-body_small">Last Year Score ({lastFiscalYear})</div>
                            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                               
                                <template if:true={showUpArrowLast}>
                                     <div class="slds-text-heading_medium slds-m-right_xx-small slds-text-color_success">{lastFiscalYearScore}</div>
                                    <lightning-icon icon-name="utility:arrowup" size="x-small" style="color: #2e844a;"></lightning-icon>
                                </template>
                                <template if:true={showDownArrowLast}>
                                     <div class="slds-text-heading_medium slds-m-right_xx-small slds-text-color_error">{lastFiscalYearScore}</div>
                                    <lightning-icon icon-name="utility:arrowdown" size="x-small" style="color: #ea001e;"></lightning-icon>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="slds-m-top_small">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <div class="slds-col">
                            <span class="slds-text-body_small slds-text-color_weak">
                                {paginationInfo}
                            </span>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <div class="slds-button-group" role="group">
                                <button class="slds-button slds-button_neutral" disabled={isFirstPage} onclick={handlePrevPage}>
                                    Previous
                                </button>
                                <button class="slds-button slds-button_neutral" disabled={isLastPage} onclick={handleNextPage}>
                                    Next
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        

        </template>
    </article>
</template>
