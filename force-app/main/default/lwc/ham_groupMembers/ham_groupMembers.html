<template>
    <div class={rootClass}>

        <!-- Header -->
        <h2 class="members-title">Group Members</h2>

        <div class="filters-row">
            <!-- Search (directory-style bar + button) -->
            <div class="search-row">
                <input type="text" class="search-input" placeholder="Search Members..."
                    value={searchKey} oninput={handleSearchInput} onkeydown={handleSearchKeydown} />
                <button class="search-btn" onclick={handleSearchClick} title="Search">
                    <lightning-icon icon-name="utility:search" size="x-small" class="seacrh-icon"
                        title="Search"></lightning-icon>
                </button>
            </div>

            <!-- List / Grid view toggles (directory-style, desktop only — mobile is grid-only) -->
            <template lwc:if={isDesktopScreen}>
                <div class="view-toggle">
                    <button class={listViewClass} data-view="list" onclick={handleViewToggle} title="List View">
                        <template lwc:if={isListView}>
                            <img src={icons.viewCheckIcon} class="check-icon" />
                        </template>
                        <img src={icons.listViewIcon} alt="List view" />
                    </button>
                    <button class={gridViewClass} data-view="grid" onclick={handleViewToggle} title="Grid View">
                        <template lwc:if={isGridView}>
                            <img src={icons.viewCheckIcon} class="check-icon" />
                        </template>
                        <img src={icons.gridViewIcon} alt="Grid view" />
                    </button>
                </div>
            </template>
        </div>

        <!-- Directory filters (all 12, incl. More Filters modal) — inline on desktop only;
             on mobile the filter component renders full-screen, so it lives in the overlay below -->
        <template lwc:if={isDesktopScreen}>
            <div class="filters-row">
                <div class="filters-left-group">
                    <c-ham_alumni-search-filter-cmp filters={filters} contact-id={contactId}
                        saved-filters={savedFilters} onfilterchange={handleFilterChange}
                        is-override={isOverride}>
                    </c-ham_alumni-search-filter-cmp>
                </div>
            </div>
        </template>

        <!-- Mobile: FAB opens the full-screen filter overlay (same pattern as the directory) -->
        <template lwc:if={isMobileScreen}>
            <div class={mobileFilterContainerClass}>
                <div class="mobile-filter-overlay">
                    <c-ham_alumni-search-filter-cmp filters={filters} contact-id={contactId}
                        saved-filters={savedFilters} onfilterchange={handleFilterChange}
                        onclosemobilefilters={handleCloseMobileFilters} is-override={isOverride}>
                    </c-ham_alumni-search-filter-cmp>
                </div>
            </div>
            <button class="mal-fab" onclick={handleFilterFabClick} title="Filters">
                <img src={icons.filter} alt="filter" />
            </button>
        </template>

        <!-- Applied filter badges -->
        <template lwc:if={desktopFilterBadges.length}>
            <div class="desktop-filter-badges">
                <template for:each={desktopFilterBadges} for:item="badge">
                    <div key={badge.uniqueId} class="desktop-badge-pill">
                        <strong>{badge.category}:</strong> {badge.value}
                        <button class="badge-remove-btn"
                                data-placeholder={badge.category}
                                onclick={handleRemoveFilterPill}
                                title="Remove filter">✕
                        </button>
                    </div>
                </template>
            </div>
        </template>

        <!-- Members in list or grid view (same components as the Alumni Directory; mobile is grid-only) -->
        <template lwc:if={showListDisplay}>
            <c-ham_alumni-list-display-cmp alumni-list={filteredData} tab={directoryTabName}
                onrefreshdata={handleChildRefresh} user-contact-id={contactId}
                onviewprofile={handleProfileSelect} view={view} is-override={isOverride}
                is-parent-loading={isLoading}
                is-logined-portal-con-privacy-open={_protalLogedUserPrivacy}>
            </c-ham_alumni-list-display-cmp>
        </template>
        <template lwc:if={showGridDisplay}>
            <c-ham_alumni-grid-display-cmp alumni-list={filteredData} tab={directoryTabName}
                onrefreshdata={handleChildRefresh} user-contact-id={contactId}
                onviewprofile={handleProfileSelect} view={view} is-override={isOverride}
                is-parent-loading={isLoading}
                is-from-group-members="true"
                is-logined-portal-con-privacy-open={_protalLogedUserPrivacy}>
            </c-ham_alumni-grid-display-cmp>
        </template>

        <!-- Empty state is rendered by the display components (same as the directory) -->

        <!-- Loading -->
        <template lwc:if={isLoading}>
            <div class="spinner-fixed" style="height: 15rem">
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
            </div>
        </template>

        <!-- Pagination (directory component) -->
        <c-ham_-pagination-util total-records={totalRecordsForChild} page-size={pageSizeForChild}
            current-page={currentPage} result-label="Records" is-override={isOverride}
            onpagechange={handlePageChange}>
        </c-ham_-pagination-util>
    </div>
</template>
