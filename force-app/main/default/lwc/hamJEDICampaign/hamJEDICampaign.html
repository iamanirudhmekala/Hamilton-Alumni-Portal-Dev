<template>
    <div class="backgroundWhite">
        <lightning-accordion allow-multiple-sections-open="true" active-section-name={activeCampaignSection} onsectiontoggle={handleCampaignSectionToggle}>
            <lightning-accordion-section name="Campaigns" label="Campaigns">
                <template if:true={loading}>
                    <lightning-spinner
                        alternative-text="Loading..."
                        size="medium"
                        variant="brand">
                    </lightning-spinner>
                </template>
                <template lwc:if={campaignDetails}>
                    <!-- Campaign Record Table -->
                    <div class="slds-p-around_small" style="width: 100%;">
                        <div class="label slds-text-title_caps slds-text-color_brand">Campaigns</div>
                        <div style="overflow-x: auto;">
                            <lightning-datatable
                                key-field="Id"
                                data={campaignDetails}
                                columns={campaignColumns}
                                hide-checkbox-column
                                sorted-by={sortedBy}
                                sorted-direction={sortedDirection}
                                onsort={handleCampaignSort}>
                            </lightning-datatable>
                        </div>
                        <template if:true={showPagination}>
                            <div class="slds-m-top_small slds-grid slds-grid_align-spread slds-align_absolute-center">
                                <lightning-button label="Prev" onclick={prevPage} disabled={isFirstPage}></lightning-button>
                                <div class="slds-m-horizontal_small">
                                    Page {pageNumber} of {totalPages} · {totalRecords} total
                                </div>
                                <lightning-button label="Next" onclick={nextPage} disabled={isLastPage}></lightning-button>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:else> No Campaigns Found for this Contact </template>
            </lightning-accordion-section>
        </lightning-accordion>
    </div>
</template>
