<template>
<div class={wrapperClass}>
    <template if:true={isReceiptsTable}>
        <div class="slds-card slds-m-bottom_medium" style="background-color: white; border: 1px solid #dddbda; border-radius: 4px; overflow: hidden;">
            <div class="slds-p-around_small slds-grid slds-grid_vertical-align-center" 
                onclick={toggleFilter} 
                style="cursor: pointer; background-color: #f3f3f3; border-bottom: 1px solid #dddbda;">
                <lightning-icon 
                    icon-name={filterIcon} 
                    size="x-small" 
                    class="slds-m-right_x-small">
                </lightning-icon>
                <span class="slds-text-title_bold filter-header-text">Filter by Date Range</span>
            </div>

            <template if:true={isFilterExpanded}>
                <div class="slds-p-around_small">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <lightning-input type="date" label="Start Date" onchange={handleStartDate}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <lightning-input type="date" label="End Date" onchange={handleEndDate}></lightning-input>
                        </div>
                        
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-4 slds-p-top_large">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <div class="slds-text-align_right slds-text-color_weak">
                                    Showing {showingCount} of {totalCount} {tableNameLower}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <table class="data-table">
        <thead>
            <tr>
                <template for:each={columns} for:item="col">
                    <th key={col.apiName} onclick={handleSort} data-field={col.apiName}>{col.label} 
                        <template if:true={col.isSortedColumn}>
                            <span class="sort-icon">{sortDirectionIcon}</span>
                        </template>                        
                    </th>
                </template>
            </tr>
        </thead>
        <tbody>
            <template if:true={hasRecords}>
                <template for:each={displayRecords} for:item="record">
                    <tr key={record.Id}>
                        <template for:each={record.cells} for:item="cell">
                            <td key={cell.key}>
                                <template if:false={cell.isFileAction}>
                                    {cell.value}
                                </template>

                                <template if:true={cell.isFileAction}>
                                    <template if:true={cell.isProcessed}>
                                        <a href="javascript:void(0);" onclick={handleViewFile} data-id={record.Id}>
                                            <lightning-icon icon-name="utility:download" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            View
                                        </a>
                                    </template>
                                    <template if:false={cell.isProcessed}>
                                        <span class="slds-text-color_weak">Processing</span>
                                    </template>
                                </template>
                            </td>
                        </template>
                    </tr>
                </template>
            </template>
            <template if:false={hasRecords}>
                <tr>
                    <td class="no-message-class" colspan={tableData.columnLabels.length}>{label.noRecordsMsg}</td>
                </tr>
            </template>
            <template if:true={tableData.hasMore}>
                <tr>
                    <td colspan={tableData.columnLabels.length} class="load-more-row" onclick={handleLoadMore}>
                        <strong>{label.loadMore}</strong>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>

    <template if:true={isReceiptsTable}>
        <div class="slds-m-top_medium slds-p-around_small footer-message" style="background-color: #fff9e6; border: 1px solid #ffc107; border-radius: 4px;">
            <lightning-formatted-rich-text value={label.receiptFooter}></lightning-formatted-rich-text>
        </div>
    </template>
</div>
</template>
