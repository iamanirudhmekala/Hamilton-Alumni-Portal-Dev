<template>
    <lightning-card title="Portal Login History" icon-name="standard:user">
        <div class="slds-var-p-horizontal_medium slds-grid slds-gutters slds-wrap">
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                <lightning-input
                    type="search"
                    label="Search person"
                    placeholder="All portal users — type a name to narrow"
                    onchange={handleSearchInput}>
                </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                <lightning-combobox
                    label="Date range"
                    value={days}
                    options={windowOptions}
                    onchange={handleDaysChange}>
                </lightning-combobox>
            </div>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <template if:true={showNoResults}>
            <div class="slds-var-p-around_medium slds-text-color_weak">
                No login activity in the selected window.
            </div>
        </template>

        <template if:true={hasData}>
            <template if:true={isTruncated}>
                <div class="slds-var-p-horizontal_medium slds-var-p-vertical_x-small slds-text-color_weak slds-text-body_small">
                    Showing the newest 5,000 logins for this search and date range — narrow your search or shorten the date range to see complete history.
                </div>
            </template>

            <div class="slds-var-p-horizontal_medium slds-var-p-bottom_small slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                    <lightning-combobox
                        label="Status"
                        value={statusFilter}
                        options={statusOptions}
                        data-filter="status"
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                    <lightning-combobox
                        label="Platform"
                        value={platformFilter}
                        options={platformOptions}
                        data-filter="platform"
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                    <lightning-combobox
                        label="Application"
                        value={applicationFilter}
                        options={applicationOptions}
                        data-filter="application"
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                    <lightning-combobox
                        label="Browser"
                        value={browserFilter}
                        options={browserOptions}
                        data-filter="browser"
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>
            </div>

            <template if:true={showNoFilterMatches}>
                <div class="slds-var-p-around_medium slds-text-color_weak">
                    No logins match the selected filters.
                </div>
            </template>

            <template if:false={showNoFilterMatches}>
                <div class="slds-var-p-around_medium">
                    <div class="chart-container">
                        <canvas class="login-chart"></canvas>
                    </div>
                </div>

                <lightning-datatable
                    key-field="rowKey"
                    data={pagedLogins}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>

                <div class="slds-var-p-around_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <lightning-button
                        label="Previous"
                        onclick={handlePrevPage}
                        disabled={isFirstPage}>
                    </lightning-button>
                    <span>{pageLabel}</span>
                    <lightning-button
                        label="Next"
                        onclick={handleNextPage}
                        disabled={isLastPage}>
                    </lightning-button>
                </div>
            </template>
        </template>

        <template if:true={error}>
            <div class="slds-var-p-around_medium slds-text-color_error">
                Unable to load login history.
            </div>
        </template>
    </lightning-card>
</template>
