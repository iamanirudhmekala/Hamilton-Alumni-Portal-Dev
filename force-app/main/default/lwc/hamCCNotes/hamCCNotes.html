<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-standard-note" style="background-color: rgb(75, 164, 118);">
                        <svg class="slds-icon slds-icon_small" aria-hidden="true">
                            <use xlink:href="/assets/icons/standard-sprite/svg/symbols.svg#note"></use>
                        </svg>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span><strong>Notes</strong></span>
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <template if:false={isMobile}>
                        <div class="desktop-actions">
                            <lightning-button
                                label={filtersButtonLabel}
                                onclick={handleFiltersToggle}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button
                                variant="brand"
                                label={newNoteButtonLabel}
                                onclick={handleAddClick}>
                            </lightning-button>
                        </div>
                    </template>
                    <template if:true={isMobile}>
                        <div class="mobile-actions">
                            <lightning-button-icon
                                icon-name="utility:filterList"
                                aria-label={filtersButtonLabel}
                                alternative-text={filtersButtonLabel}
                                title={filtersButtonLabel}
                                onclick={handleFiltersToggle}
                                class="slds-var-m-right_x-small">
                            </lightning-button-icon>
                            <lightning-button-icon
                                icon-name={newNoteIconName}
                                aria-label={newNoteButtonLabel}
                                alternative-text={newNoteButtonLabel}
                                title={newNoteButtonLabel}
                                onclick={handleAddClick}
                                class="slds-var-m-right_x-small">
                            </lightning-button-icon>
                        </div>
                    </template>
                    <button
                        class="slds-button slds-button_icon slds-button_icon-border-filled slds-m-left_x-small"
                        onclick={handleAccordionToggle}
                        aria-expanded={isExpanded}>
                        <lightning-icon icon-name={accordionIconName} size="x-small"></lightning-icon>
                        <span class="slds-assistive-text">Toggle Notes</span>
                    </button>
                </div>
            </header>
        </div>

        <template if:true={isExpanded}>
            <div class="slds-card__body">

                <!-- Inline New Note Form -->
                <template if:true={showForm}>
                    <div class="slds-box slds-theme_default slds-m-bottom_medium">
                        <div class="slds-text-heading_small slds-m-bottom_small">Add Note</div>

                        <!-- DESKTOP form layout -->
                        <template if:false={isMobile}>
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-input
                                        type="text"
                                        label="Title"
                                        value={newNoteTitle}
                                        onchange={handleTitleChange}
                                        placeholder="Enter note title..."
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <lightning-input
                                        type="date"
                                        label="Date"
                                        value={newNoteDate}
                                        onchange={handleNoteDateChange}
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1">
                                    <lightning-textarea
                                        label="Note Content"
                                        value={newNoteContent}
                                        onchange={handleContentChange}
                                        placeholder="Enter note content..."
                                        max-length="131072">
                                    </lightning-textarea>
                                </div>
                            </div>
                        </template>

                        <!-- MOBILE form layout: fully stacked -->
                        <template if:true={isMobile}>
                            <div class="mobile-filter-card">
                                <div class="mobile-filter-field">
                                    <lightning-input
                                        type="text"
                                        label="Title"
                                        value={newNoteTitle}
                                        onchange={handleTitleChange}
                                        placeholder="Enter note title..."
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="mobile-filter-field">
                                    <lightning-input
                                        type="date"
                                        label="Date"
                                        value={newNoteDate}
                                        onchange={handleNoteDateChange}
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="mobile-filter-field">
                                    <lightning-textarea
                                        label="Note Content"
                                        value={newNoteContent}
                                        onchange={handleContentChange}
                                        placeholder="Enter note content..."
                                        max-length="131072">
                                    </lightning-textarea>
                                </div>
                            </div>
                        </template>

                        <template if:true={modalError}>
                            <div class="slds-m-top_small">
                                <p class="slds-text-color_error">{modalError}</p>
                            </div>
                        </template>

                        <div class="slds-m-top_small">
                            <lightning-button
                                class="slds-var-m-right_small"
                                label="Clear"
                                onclick={handleCancel}>
                            </lightning-button>
                            <lightning-button
                                variant="brand"
                                label="Save Note"
                                onclick={handleSaveNote}
                                disabled={isSaving}>
                            </lightning-button>
                        </div>
                    </div>
                </template>

                <!-- Filter Section -->
                <template if:true={showFilters}>
                    <div class="slds-box slds-box_x-small slds-m-bottom_small slds-theme_default">

                        <!-- DESKTOP filters -->
                        <template if:false={isMobile}>
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                    <lightning-input
                                        type="text"
                                        label="Search (Title / Content)"
                                        value={filterSearchText}
                                        onchange={handleSearchTextChange}
                                        onkeydown={handleSearchKeyDown}
                                        placeholder="Search by keyword...">
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                    <lightning-input
                                        type="date"
                                        label="Start Date"
                                        value={filterStartDate}
                                        onchange={handleStartDateChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                    <lightning-input
                                        type="date"
                                        label="End Date"
                                        value={filterEndDate}
                                        onchange={handleEndDateChange}>
                                    </lightning-input>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-order_2 slds-medium-order_1">
                                    <lightning-button variant="brand" label="Search" onclick={handleSearchFilters}></lightning-button>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-order_1 slds-medium-order_2">
                                    <lightning-button variant="neutral" label="Clear" onclick={handleClearFilters}></lightning-button>
                                </div>
                            </div>
                        </template>

                        <!-- MOBILE filters: stacked card -->
                        <template if:true={isMobile}>
                            <div class="mobile-filter-card">
                                <div class="mobile-filter-field">
                                    <lightning-input
                                        type="text"
                                        label="Search (Title / Content)"
                                        value={filterSearchText}
                                        onchange={handleSearchTextChange}
                                        onkeydown={handleSearchKeyDown}
                                        placeholder="Search by keyword...">
                                    </lightning-input>
                                </div>
                                <div class="mobile-filter-field">
                                    <lightning-input
                                        type="date"
                                        label="Start Date"
                                        value={filterStartDate}
                                        onchange={handleStartDateChange}>
                                    </lightning-input>
                                </div>
                                <div class="mobile-filter-field">
                                    <lightning-input
                                        type="date"
                                        label="End Date"
                                        value={filterEndDate}
                                        onchange={handleEndDateChange}>
                                    </lightning-input>
                                </div>
                                <div class="mobile-filter-actions">
                                    <lightning-button
                                        variant="neutral"
                                        label="Clear"
                                        onclick={handleClearFilters}
                                        class="slds-m-right_small">
                                    </lightning-button>
                                    <lightning-button
                                        variant="brand"
                                        label="Search"
                                        onclick={handleSearchFilters}>
                                    </lightning-button>
                                </div>
                            </div>
                        </template>

                    </div>
                </template>

                <!-- Data -->
                <template if:true={hasData}>

                    <!-- DESKTOP: datatable -->
                    <template if:false={isMobile}>
                        <lightning-datatable
                            data={pagedNotes}
                            columns={columns}
                            key-field="Id"
                            hide-checkbox-column
                            onsort={handleSort}
                            sorted-direction={sortedDirection}
                            sorted-by={sortedBy}>
                        </lightning-datatable>
                    </template>

                    <!-- MOBILE: sort bar + cards -->
                    <template if:true={isMobile}>
                        <div class="mobile-sort-bar">
                            <lightning-combobox
                                label="Sort by"
                                value={sortedBy}
                                options={mobileSortOptions}
                                onchange={handleMobileSortChange}
                                class="mobile-sort-combo">
                            </lightning-combobox>
                            <lightning-button-icon
                                icon-name={mobileSortDirectionIcon}
                                alternative-text={mobileSortDirectionLabel}
                                title={mobileSortDirectionLabel}
                                onclick={toggleMobileSortDirection}
                                class="slds-var-m-left_x-small">
                            </lightning-button-icon>
                        </div>

                        <div class="mobile-card-container">
                            <template for:each={mobilePageNotes} for:item="note">
                                <div key={note.Id} class="mobile-card">

                                    <!-- Card header: title link -->
                                    <div class="card-header">
                                        <a href={note.TitleLink} target="_blank" class="card-title-link">{note.Title}</a>
                                    </div>

                                    <!-- Date row -->
                                    <div class="card-row">
                                        <span class="card-label">Date</span>
                                        <span class="card-value-bold">{note.formattedDate}</span>
                                    </div>

                                    <div class="card-divider"></div>

                                    <!-- Content stacked -->
                                    <div class="card-row-stacked">
                                        <span class="card-label">Content</span>
                                        <span class="card-value-full">{note.displayContent}</span>
                                    </div>

                                    <template if:true={note.needsTruncation}>
                                        <div class="show-more-row">
                                            <a data-id={note.Id} onclick={toggleShowMore}>{note.showMoreLabel}</a>
                                        </div>
                                    </template>

                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Pagination -->
                    <div class="slds-m-top_medium slds-text-align_center">
                        <template if:true={showPagination}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_justify-center slds-m-bottom_small">
                                <div class="slds-text-body_small slds-var-m-right_small">
                                    Showing {paginationInfo.startIndex} - {paginationInfo.endIndex} of {recordsCount}
                                </div>
                                <lightning-button-icon
                                    icon-name="utility:chevronleft"
                                    variant="border-filled"
                                    size="small"
                                    disabled={previousDisabled}
                                    onclick={handlePrevious}
                                    title="Previous Page">
                                </lightning-button-icon>
                                <span class="slds-var-m-horizontal_small slds-text-body_small">{currentPage} of {totalPages}</span>
                                <lightning-button-icon
                                    icon-name="utility:chevronright"
                                    variant="border-filled"
                                    size="small"
                                    disabled={nextDisabled}
                                    onclick={handleNext}
                                    title="Next Page">
                                </lightning-button-icon>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasData}>
                    <p class="slds-p-around_medium slds-text-color_weak">No notes found.</p>
                </template>

            </div>
        </template>
    </article>
</template>
