<template>
  <!-- Header bar mimicking hamCCVolunteerEngagement style -->
  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__figure">
          <!-- Green box with standard icon -->
          <span class="slds-icon_container slds-icon-standard-task" style="background-color: #f59331;">
            <svg class="slds-icon slds-icon_small" aria-hidden="true">
              <use xlink:href="/assets/icons/standard-sprite/svg/symbols.svg#task"></use>
            </svg>
          </span>
        </div>
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">
            <span><strong>Interests</strong></span>
          </h2>
        </div>
        <div class="slds-no-flex">
          <!-- Desktop: full label button -->
          <template if:false={isMobile}>
            <div class="desktop-actions">
              <lightning-button
                label={addButtonLabel}
                onclick={handleAddClick}>
              </lightning-button>
            </div>
          </template>
          <!-- Mobile: icon-only button -->
          <template if:true={isMobile}>
            <div class="mobile-actions">
              <lightning-button-icon
                icon-name={mobileAddIcon}
                variant="border-filled"
                alternative-text={mobileAddLabel}
                title={mobileAddLabel}
                onclick={handleAddClick}
                class="slds-var-m-right_x-small">
              </lightning-button-icon>
            </div>
          </template>
          <!-- Expand/collapse toggle -->
          <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-m-left_x-small" onclick={handleAccordionToggle} aria-expanded={activeSection}>
            <lightning-icon icon-name={activeSectionIcon} size="x-small"></lightning-icon>
            <span class="slds-assistive-text">Toggle Interests</span>
          </button>
        </div>
      </header>
    </div>

    <template if:true={isSaving}>
        <div class="spinner-container">
            <lightning-spinner
                alternative-text="Saving funding interest"
                size="medium"
            ></lightning-spinner>
        </div>
    </template>

    <!-- Expandable body controlled by isExpanded (no standard accordion) -->
    <template if:true={isExpanded}>
      <!-- Add Form -->
      <template if:true={showForm}> 
        <div class="slds-box slds-theme_default slds-m-bottom_medium">
          <div class="slds-text-heading_small slds-m-bottom_small">Add Funding Interest</div>
          <div class="slds-grid slds-wrap slds-gutters">
            <!-- Interest Value (Record Picker) from ucinn_ascendv2__Foundation_Funding_Interests__c -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <div class="slds-form-element">
                <label class="slds-form-element__label">Interest Value</label>
                <div class="slds-form-element__control">
                  <lightning-record-picker
                    object-api-name="ucinn_ascendv2__Foundation_Funding_Interests__c"
                    label="Interest Value"
                    placeholder="Search Interest Value..."
                    filter={interestFilter}
                    value={draftInterest.ucinn_ascendv2__Foundation_Funding_Interests__c}
                    data-field="ucinn_ascendv2__Foundation_Funding_Interests__c"
                    onchange={handleRecordPickerChange}>
                  </lightning-record-picker>
                </div>
              </div>
            </div>

             <!-- Owner Id -->
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                  <div class="slds-form-element">
                    <label class="slds-form-element__label">Assigned user</label>
                    <div class="slds-form-element__control">        
                        <lightning-record-picker
                            object-api-name="User"
                            label="Assigned To"
                            placeholder="Search User to assign..."
                            value={draftInterest.ownerId}
                            filter={userFilters}
                            onchange={handleAssignmentChange}
                            >
                        </lightning-record-picker>
                    </div>
                </div>
            </div>
            <!-- Start Date -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <lightning-input
                type="date"
                label="Start Date"
                value={draftInterest.ucinn_ascendv2__Start_Date__c}
                data-field="ucinn_ascendv2__Start_Date__c"
                onchange={handleInputChange}>
              </lightning-input>
            </div>

            <!-- End Date -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <lightning-input
                type="date"
                label="End Date"
                value={draftInterest.ucinn_ascendv2__End_Date__c}
                data-field="ucinn_ascendv2__End_Date__c"
                onchange={handleInputChange}>
              </lightning-input>
            </div>

            <!-- Activity -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
              <lightning-combobox
                  name="Activity"
                  label="Activity"
                  placeholder="Choose Activity"
                  value={draftInterest.HAM_Activity__c}
                  onchange={handleChange}
                  options={statusOptions}
              >
              </lightning-combobox>
            </div>

            <!-- Notes -->
            <div class="slds-col slds-size_1-of-1">
              <lightning-textarea
                label="Notes"
                placeholder="Enter any notes..."
                value={draftInterest.HAM_Interest_Notes__c}
                data-field="HAM_Interest_Notes__c"
                onchange={handleInputChange}
                max-length="32768">
              </lightning-textarea>
            </div>
          </div>

          <div class="slds-m-top_small">
            <lightning-button class="slds-var-m-right_small" label="Clear" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
          </div>
        </div>
      </template>

      <!-- List/Table -->
      <template if:true={hasRecords}>

        <!-- Desktop: datatable -->
        <template if:false={isMobile}>
          <div style="overflow-x: auto;">
            <lightning-datatable
              key-field="Id"
              data={pagedRecords}
              columns={columns}
              hide-checkbox-column
              onsort={handleSort}
              sorted-by={sortedBy}
              sorted-direction={sortedDirection}
              class="slds-var-m-top_small">
            </lightning-datatable>
          </div>
        </template>

        <!-- Mobile: sort bar + cards -->
        <template if:true={isMobile}>
          <div class="mobile-sort-bar slds-var-m-top_small">
            <lightning-combobox
              label="Sort by"
              value={sortedBy}
              options={mobileSortOptions}
              onchange={handleMobileSortChange}
              class="mobile-sort-combo">
            </lightning-combobox>
            <lightning-button-icon
              icon-name={mobileSortDirectionIcon}
              alternative-text={mobileSortDirectionLabel}
              title={mobileSortDirectionLabel}
              onclick={toggleMobileSortDirection}
              class="slds-var-m-left_x-small">
            </lightning-button-icon>
          </div>

          <div class="mobile-card-container">
            <template for:each={mobilePageRecords} for:item="rec">
              <div key={rec.Id} class="mobile-card">
                <div class="card-header">
                  <a href={rec.recordUrl} class="card-title-link">{rec.Name}</a>
                </div>
                <div class="card-row">
                  <span class="card-label">Foundation Funding Interest</span>
                  <span><a href={rec.ffiUrl}>{rec.ffiName}</a></span>
                </div>
                <div class="card-row">
                  <span class="card-label">Category</span>
                  <span>{rec.HAM_Category__c}</span>
                </div>
                <div class="card-row">
                  <span class="card-label">Start Date</span>
                  <span class="card-value-bold">{rec.startDateET}</span>
                </div>
                <div class="card-row">
                  <span class="card-label">End Date</span>
                  <span class="card-value-bold">{rec.endDateET}</span>
                </div>
                <template if:true={rec.HAM_Activity_Type__c}>
                  <div class="card-row">
                    <span class="card-label">Activity</span>
                    <span>{rec.HAM_Activity_Type__c}</span>
                  </div>
                </template>
                <template if:true={rec.displayNotes}>
                  <div class="card-divider"></div>
                  <div class="card-row-stacked">
                    <span class="card-label">Notes</span>
                    <span class="card-value-full">{rec.displayNotes}</span>
                  </div>
                  <template if:true={rec.needsTruncation}>
                    <div class="show-more-row">
                      <a data-id={rec.Id} onclick={toggleShowMore}>{rec.showMoreLabel}</a>
                    </div>
                  </template>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- Pagination controls -->
        <template if:true={showPagination}>
          <div class="slds-var-m-top_medium slds-text-align_center">
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center slds-var-m-bottom_small">
              <div class="slds-text-body_small slds-var-m-right_small">
                Showing {paginationInfo.startIndex} - {paginationInfo.endIndex} of {recordsCount}
              </div>
              <lightning-button-icon
                icon-name="utility:chevronleft"
                variant="border-filled"
                size="small"
                disabled={previousDisabled}
                onclick={handlePrevious}
                title="Previous Page">
              </lightning-button-icon>
              <span class="slds-var-m-horizontal_small slds-text-body_small">
                {currentPage} of {totalPages}
              </span>
              <lightning-button-icon
                icon-name="utility:chevronright"
                variant="border-filled"
                size="small"
                disabled={nextDisabled}
                onclick={handleNext}
                title="Next Page">
              </lightning-button-icon>
            </div>
          </div>
        </template>
      </template>

      


      <template if:false={hasRecords}>
        <div class="slds-illustration slds-illustration_small">
          <div class="slds-illustration__svg">
            <svg class="slds-icon slds-icon-utility-open_folder" aria-hidden="true">
              <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#open_folder"></use>
            </svg>
          </div>
          <div class="slds-text-longform">
            <h3 class="slds-text-heading_medium">No interests yet</h3>
            <p class="slds-m-top_x-small">Click Add to create your first funding interest.</p>
          </div>
        </div>
      </template>
    </template>
  </article>
</template>
