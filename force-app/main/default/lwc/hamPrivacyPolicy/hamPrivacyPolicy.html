                        <h1>Hamilton Advancement Digital Services Privacy Policy </h1>

  <p>Last modified: 12-05-2026 </p>


<h2>Introduction</h2>




<p>Hamilton College ("Hamilton" or "we") respect your privacy and are committed to protecting it through our compliance with this policy. This Privacy Policy ("Policy") describes:</p>


<ul>


<li>The types of information we may collect or that you may provide when you download, install, create an account on, access, or use the Hamilton College Advancement: Salesforce Experience Cloud Mobile Go Application or portal website (collectively the "Advancement Digital Services").</li>


<li>Our practices for collecting, using, maintaining, protecting, and disclosing that information.</li>


</ul>






<p>This Policy applies only to information we collect via the Advancement Digital Services and in email, text, and other electronic communications sent through or in connection with the Advancement Digital Services. If you are located within the European Union and are looking for more information, please visit our <a href="https://www.hamilton.edu/gdpr">GDPR Privacy Notices</a>.</p>






<div class="callout">


<strong>Important</strong>


This policy does <em>not</em> apply to information we collect offline or on any other Hamilton apps or websites, nor to information you provide to or that is collected by any third party.


</div>






<p>Please read this Policy carefully to understand our policies and practices regarding your information and how we will treat it. If you do not agree with our policies and practices, do not download, create an account, or use the Advancement Digital Services. By downloading, creating an account, or using the Advancement Digital Services, you agree to this Privacy Policy and our <a href="#">Terms of Use</a>, incorporated herein by reference. This Policy may change from time to time (see <a href="#changes">Changes to Our Privacy Policy</a>). Your continued use of the Advancement Digital Services after we revise this Policy means you accept those changes, so please check the Policy periodically for updates.</p>






<!-- Children -->


<h2>Children Under the Age of 13</h2>


<p>The Advancement Digital Services are not intended for children under 13 years of age. No one under age 13 may provide any information from children under 13. We do not knowingly collect personal information from children under 13. If you are under 13, do not use or provide any information on the Advancement Digital Services or through any of its features, create an account, or provide any information about yourself to us, including your name, address, telephone number, email address, or any screen name or username you may use.</p>


<p>If we learn we have collected or received personal information from a child under 13 without verification of parental consent, we will delete that information. If you believe we might have any information from or about a child under 13, please <a href="#contact">contact us</a>.</p>






<!-- Information We Collect -->


<h2>Information We Collect and How We Collect It</h2>


<p>We collect information from and about users of our Advancement Digital Services:</p>


<ul>


<li>Directly from you when you provide it to us.</li>


<li>Automatically when you use the Advancement Digital Services.</li>


<li>From our internal records related to your time at Hamilton.</li>


<li>From publicly available sources.</li>


</ul>






<h3>Information You Provide to Us</h3>


<p>When you download, create an account, or use the Advancement Digital Services, we may ask you to provide information:</p>


<ul>


<li>By which you may be personally identified, such as name, address, email address, telephone number, account credentials, graduation and post-graduation information, employment information, location information (if enabled), profile photo (if enabled and shared), or any other information that may be considered personal information under applicable law ("personal information").</li>


</ul>


<p>This information includes:</p>


<ul>


<li>Information that you provide by completing webforms via the Advancement Digital Services, including information provided at the time of creating an account and posting information.</li>


<li>Records and copies of your correspondence (including email addresses and phone numbers), if you contact us.</li>


<li>Your responses to surveys or other inquiries that we might ask you to complete.</li>


<li>Your search queries in the Advancement Digital Services.</li>


</ul>






<h3>Information We Collect Through Automatic Data Collection Technologies</h3>


<p>As you navigate through and interact with our Advancement Digital Services, we may use automatic data collection technologies to collect certain information about your device, browsing, and usage activity, including:</p>


<ul>


<li><strong>Usage Details.</strong> Traffic data, location data, logs, and other communication data and the resources you access and use on or through the Advancement Digital Services.</li>


<li><strong>Device Information.</strong> Your device's unique identifier, IP address, operating system, browser type, mobile network information, and the device's telephone number.</li>


<li><strong>Stored Information and Files.</strong> Metadata and other information associated with other files stored on your device — for example, photographs, audio and video clips, personal contacts, and address book information — if you enable such access.</li>


<li><strong>Location Information.</strong> Real-time information about the location of your device, if you enable such access.</li>


</ul>






<p>If you do not want us to collect this information, do not download the Advancement Digital Services, delete it from your device, or do not enable certain features (like location services or photo sharing). Please note that opting out of location information collection will disable its location-based features.</p>






<h3>Technologies Used for Automatic Collection</h3>


<ul>


<li><strong>Cookies</strong> are small files placed on your device that allow us to recognize your browser and store preferences or settings. Types of cookies we use include:


<ul>


<li><em>Strictly Necessary Cookies:</em> Required for the Advancement Digital Services to function and cannot be switched off.</li>


<li><em>Functional Cookies:</em> Enable enhanced functionality and personalization.</li>


<li><em>Marketing Cookies:</em> Used to support promotional features and measure engagement, such as displaying institutional messages or understanding aggregate interaction with campaigns.</li>


</ul>


</li>


<li><strong>Pixels</strong> are small pieces of code embedded on a webpage that help track user interactions, such as page views or clicks. They are often used to measure the effectiveness of advertising and may allow third-party providers to collect information about your activity for analytics and marketing purposes.</li>


<li><strong>Analytics</strong> may be provided by third-party vendors to analyze traffic and usage. For example, we utilize Google Analytics, which tracks and reports website traffic. You can opt out of Google Analytics by installing the <a href="https://tools.google.com/dlpage/gaoptout" target="_blank" rel="noopener">Google Analytics opt-out browser add-on</a>. For more information, please visit the <a href="https://policies.google.com/privacy?hl=en" target="_blank" rel="noopener">Google Privacy Terms</a> page.</li>


</ul>






<p>We may tie non-personal information collected automatically to personal information about you that we collect from other sources or that you provide to us.</p>


<p>By using the Advancement Digital Services, unless you set your browser otherwise, you consent to our use of these technologies as described above. If you do not want to allow cookies or analytics cookies, you can generally opt out by setting your browser to reject cookies. Please be aware that disabling cookies may limit functionality and impact your overall experience.</p>






<!-- User Generated Content -->


<h2>User Generated Content</h2>


<p>Some features of our Advancement Digital Services enable users to submit their own content, such as through messaging boards or connecting and messaging with others. You understand and agree that Hamilton may not review, audit, or otherwise verify the accuracy of your data. Please remember that any Personal Information you submit or post as user-generated content could in some cases be seen by others or become public.</p>


<p>If you submit such information, you are solely responsible for any information uploaded or entered. You should exercise caution when deciding to disclose your Personal Information in such submissions or posts. We cannot prevent others from using that information in a manner that may violate this Policy or the law. You shall not provide any information other than your own, or of others without their express consent.</p>






<!-- How We Use -->


<h2>How We Use Your Information</h2>


<p>We use information that we collect about you or that you provide to us, including any personal information, to:</p>


<ul>


<li>Provide you with the Advancement Digital Services and its contents, and any other information, products, or services that you request from us, including by providing a more personalized experience.</li>


<li>Improve our Advancement Digital Services.</li>


<li>Alumni and donor outreach and engagement.</li>


<li>Marketing and analytics.</li>


<li>Fulfill any other purpose for which you provide it.</li>


<li>Give you notices about your account.</li>


<li>Carry out our obligations and enforce our rights arising from any contracts entered into between you and us.</li>


<li>Notify you when Advancement Digital Services updates are available, and of changes to any products or services we offer or provide through it.</li>


<li>Feedback purposes.</li>


<li>Promotional and recruiting purposes, including soliciting financial contributions.</li>


<li>Statistical and behavioral analysis of online behavior for development purposes.</li>


<li>Content improvement and customization.</li>


<li>To detect, prevent, and address technical issues.</li>


<li>To prevent and detect criminal and/or fraudulent activity.</li>


<li>Legal compliance.</li>


<li>Other purposes for which we have obtained your consent.</li>


</ul>






<!-- Disclosure -->


<h2>Disclosure of Your Information</h2>


<p>We may disclose aggregated information about our users, and information that does not identify any individual or device, without restriction.</p>


<p>In addition, we may disclose personal information that we collect or you provide:</p>


<ul>


<li>To our subsidiaries and affiliates.</li>


<li>To contractors, service providers, and other third parties we use to support our business, including our digital services developers.</li>


<li>To a buyer or other successor in the event of a merger, divestiture, restructuring, reorganization, dissolution, or other sale or transfer of some or all of Hamilton's assets.</li>


<li>To fulfill the purpose for which you provide it.</li>


<li>For any other purpose disclosed by us when you provide the information.</li>


<li>With your consent.</li>


</ul>


<p>We may also disclose your personal information:</p>


<ul>


<li>To comply with any court order, law, or legal process, including to respond to any government or regulatory request.</li>


<li>To enforce our rights arising from any contracts entered into between you and us, including the <a href="#">Terms of Use</a>.</li>


<li>If we believe disclosure is necessary or appropriate to protect the rights, property, or safety of Hamilton, our students, alumni, faculty and staff, or others.</li>


</ul>






<!-- Choices -->


<h2>Choices About How We Use and Disclose Your Information</h2>


<p>We strive to provide you with choices regarding the information you provide to us:</p>


<ul>


<li><strong>Tracking Technologies.</strong> You can set your browser to refuse all or some browser cookies, or to alert you when cookies are being sent. If you disable or refuse cookies, some parts of the Advancement Digital Services may be inaccessible or not function properly.</li>


<li><strong>Location Information.</strong> You can choose whether or not to allow the Advancement Digital Services to collect and use real-time location data through the device's privacy settings. If you block location information, some features may become inaccessible or not function properly.</li>


<li><strong>Promotion by Hamilton.</strong> If you do not want us to use your email address or other contact information to promote our advancement services, you can opt out by logging into the Advancement Digital Services and adjusting your user preferences in your account profile, or by sending us an email.</li>


</ul>


<p>We do not control third parties' collection or use of your information to serve interest-based advertising. However, these third parties may provide you with ways to choose not to have your information collected or used in this way. You can opt out of receiving targeted ads from members of the Network Advertising Initiative ("NAI") on the <a href="https://optout.networkadvertising.org/" target="_blank" rel="noopener">NAI's website</a>.</p>






<!-- Accessing -->


<h2>Accessing and Correcting Your Personal Information and Account</h2>


<p>You can review and change your personal information by logging into the Advancement Digital Services and visiting your account profile page. You may also send us an email to request correction to any personal information that you have provided to us. You may request deletion of your account via your account profile or by emailing us.</p>






<!-- Third Party Links -->


<h2>Third Party Links</h2>


<p>The Advancement Digital Services may contain links to other websites or applications, including social media platforms, which are operated by us or third parties. Please be aware that Hamilton is not responsible for the privacy practices of any third party. Once you enter those websites from a link from our Advancement Digital Services, our Privacy Policy and Terms of Use do not apply. We do not control and accept no liability or responsibility for those websites. Please consult the terms and conditions and privacy policies of those third-party websites to find out how they collect and use your information.</p>






<!-- Retention -->


<h2>Retention</h2>


<p>Hamilton retains personal information processed and collected via the Advancement Digital Services for as long as necessary to maintain alumni relations, academic, archiving purposes, and our other legitimate business purposes. Hamilton will process and store your personal information only for the period necessary to achieve the purpose of the storage, or as permitted by law.</p>






<!-- Data Security -->


<h2>Data Security</h2>


<p>We have implemented measures designed to secure your information from accidental loss and from unauthorized access, use, alteration, and disclosure. However, the safety and security of your information also depends on you. Where we have given you (or where you have chosen) a password for access to certain parts of our Advancement Digital Services, you are responsible for keeping this password confidential. We ask you not to share your password with anyone.</p>


<p>Unfortunately, the transmission of information via the internet and mobile platforms is not completely secure. Although we do our best to protect your information, we cannot guarantee the security of your personal information transmitted through our Advancement Digital Services. Any transmission of personal information is at your own risk. We are not responsible for circumvention of any privacy settings or security measures included through the Advancement Digital Services.</p>






<!-- Changes -->


<h2 id="changes">Changes to Our Privacy Policy</h2>


<p>We may update our Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page. We will let you know via email and/or other notice prior to any material changes becoming effective and we will update the "Last Modified" date at the top of this Policy. You are advised to review this Policy periodically for any changes. Changes to this Policy are effective when they are posted on this page.</p>






<hr />
