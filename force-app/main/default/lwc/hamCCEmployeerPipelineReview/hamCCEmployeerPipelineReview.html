<template>
    <lightning-card icon-name="custom:custom85">
        <div slot="title">
            <div class="slds-text-heading_medium">Employer Engagement Dashboard</div>
        </div>
        <div slot="actions">
            
        </div>

       

            
            <div class="slds-m-around_medium">
                <!-- Metrics Cards -->
                <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_medium">
                    <template for:each={metricsCards} for:item="card">
                        <div key={card.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                            <article class={card.cardClass}>
                                <div class="slds-media slds-media_center">
                                    <div class="slds-media__figure">
                                        <span class={card.iconContainerClass}>
                                            <lightning-icon 
                                                icon-name={card.icon} 
                                                size="small"
                                                class="slds-icon-text-default">
                                            </lightning-icon>
                                        </span>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-text-title slds-truncate" title={card.label}>
                                            {card.label}
                                        </div>
                                        <div class="metric-value">{card.value}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            <lightning-formatted-number 
                                                value={card.percentage} 
                                                format-style="percent"
                                                minimum-fraction-digits="1"
                                                maximum-fraction-digits="1">
                                            </lightning-formatted-number>
                                            <span class={card.trendClass}>
                                                <lightning-icon 
                                                    icon-name={card.trendIcon} 
                                                    size="xx-small">
                                                </lightning-icon>
                                                {card.trendText}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </template>
                </div>
                
                <!-- Main Chart Section -->
                

                 
                    <div class="slds-box slds-box_small slds-m-bottom_medium chart-section">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <div>
                                <h3 class="slds-text-heading_small">Engagement Pipeline</h3>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Click on any bar to view detailed employer records
                                </p>
                            </div>
                            <div>
                                <lightning-button-group>
                                    <lightning-button 
                                        label="Monthly" 
                                        onclick={handleMonthlyView}
                                        variant={isMonthlyView}>
                                    </lightning-button>
                                    <lightning-button 
                                        label="Quarterly" 
                                        onclick={handleQuarterlyView}
                                        variant={isQuarterlyView}>
                                    </lightning-button>
                                </lightning-button-group>
                            </div>
                        </div>
                        
                        <div class="chart-container">
                            <canvas lwc:dom="manual"  lwc:ref="mainChart" class="engagement-chart" id="mainChartId"></canvas>
                        </div>
                    </div>
                

                <!-- Trend Chart -->
                <div class="slds-box slds-box_small slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Engagement Trend (Last 6 Months)</h3>
                    <div class="trend-chart-container">
                        <canvas lwc:dom="manual"  lwc:ref="trendChart" class="trend-chart" ></canvas>
                    </div>
                </div>

                <!-- Selected Stage Info -->
                <template if:true={selectedStage}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <div class="slds-grid slds-grid_align-spread">
                            <div>
                                <lightning-icon 
                                    icon-name="utility:info" 
                                    size="small" 
                                    class="slds-m-right_x-small">
                                </lightning-icon>
                                <span class="slds-text-body_regular">
                                    Viewing {selectedStage.value} employers in 
                                    <strong>{selectedStage.name}</strong> stage
                                </span>
                            </div>
                            <div>
                                <lightning-button 
                                    label="Clear Selection" 
                                    onclick={handleClearSelection}
                                    variant="neutral">
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Data Table -->
                <template if:true={showTable}>
                    <div class="slds-m-top_medium">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                            <div>
                                <h3 class="slds-text-heading_small">{selectedStage.name} Employers</h3>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Showing {displayedRecordsCount} of {selectedStage.value} total employers
                                </p>
                            </div>
                            <div>
                                <lightning-badge 
                                    label={selectedStage.name} 
                                    class={selectedStage.badgeClass}>
                                </lightning-badge>
                            </div>
                        </div>

                        <lightning-datatable
                            key-field="id"
                            data={tableData}
                            columns={columns}
                            hide-checkbox-column
                            show-row-number-column
                            sorted-by={sortedBy}
                            sorted-direction={sortedDirection}
                            onsort={handleSort}
                            onrowaction={handleRowAction}>
                        </lightning-datatable>

                        <template if:true={hasMoreRecords}>
                            <div class="slds-text-align_center slds-m-top_small">
                                <lightning-button 
                                    label="View All ({totalRecords})" 
                                    onclick={handleViewAll}
                                    variant="neutral">
                                </lightning-button>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

        
    </lightning-card>
</template>
